name: CWD API CI

on:
  pull_request:
    paths:
      - 'cwd-api/**'
      - '.github/workflows/cwd-api.yml'
  push:
    branches:
      - main
    paths:
      - 'cwd-api/**'
      - '.github/workflows/cwd-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwd-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cwd-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: cwd-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Wrangler config
        run: cp wrangler.jsonc.example wrangler.jsonc

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run
